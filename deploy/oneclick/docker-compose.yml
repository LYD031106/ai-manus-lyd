name: ai-manus

services:
  frontend:
    image: ai-manus-oneclick/frontend:${BUNDLE_VERSION:-20260808}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - manus-network
    environment:
      BACKEND_URL: http://backend:8000

  backend:
    image: ai-manus-oneclick/backend:${BUNDLE_VERSION:-20260808}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - manus-network
    env_file:
      - .env
    environment:
      BROWSER_ENABLED: "false"
      SANDBOX_IMAGE: ai-manus-oneclick/sandbox:${BUNDLE_VERSION:-20260808}
      SANDBOX_MEM_LIMIT: ${SANDBOX_MEM_LIMIT:-256m}
      SANDBOX_NANO_CPUS: ${SANDBOX_NANO_CPUS:-500000000}
      SANDBOX_PIDS_LIMIT: ${SANDBOX_PIDS_LIMIT:-64}
      SANDBOX_NETWORK: manus-network

  mongodb:
    image: mongo:7.0
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - manus-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.0
    restart: unless-stopped
    networks:
      - manus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mongodb_data:
    name: manus-mongodb-data

networks:
  manus-network:
    name: manus-network
    driver: bridge
